<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jingjing · Settings</title>
<style>
    /* CL paper-lab style; tokens copied from CL/design/tokens.css */
    :root {
        --cl-paper: #fbf4e4; --cl-paper-dot: #e3d6b8; --cl-card: #fffef8; --cl-rule: #e3d5b8;
        --cl-ink: #2b2d42; --cl-ink-soft: #5c5f78; --cl-tag: #9a917c;
        --cl-orange: #f28c38; --cl-action: #e9781f; --cl-tape: #ffd23f; --cl-sky: #8cd3f5; --cl-mint: #b7e4c7;
        --cl-ok: #2f9e6a; --cl-warn: #e0a019; --cl-danger: #d64545;
        --cl-line-w: 2.5px; --cl-radius: 14px; --cl-shadow: 4px 4px 0 var(--cl-ink);
        --cl-font: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
        --cl-font-hand: "LXGW WenKai", KaiTi, "Microsoft YaHei", sans-serif;
        --cl-font-mono: Consolas, ui-monospace, "Microsoft YaHei", monospace;
        color-scheme: light;
        font-family: var(--cl-font);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; color: var(--cl-ink); font-size: 15px; line-height: 1.6;
        background-color: var(--cl-paper);
        background-image: radial-gradient(var(--cl-paper-dot) 2px, transparent 2px);
        background-size: 26px 26px;
    }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 24px; margin: 0 0 4px; display: inline-block; background: linear-gradient(transparent 58%, var(--cl-tape) 58%, var(--cl-tape) 92%, transparent 92%); padding: 0 4px; }
    .sub { color: var(--cl-ink-soft); margin: 6px 0 22px; font-family: var(--cl-font-hand); font-size: 16px; }
    .card {
        background: var(--cl-card); border: var(--cl-line-w) solid var(--cl-ink); border-radius: var(--cl-radius);
        box-shadow: var(--cl-shadow); padding: 20px 22px; margin-bottom: 20px;
    }
    .card h2 { font-size: 17px; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
    .step {
        display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
        background: var(--cl-tape); color: var(--cl-ink); border: 2px solid var(--cl-ink); font-size: 14px; font-weight: 700;
    }
    label { display: block; font-weight: 700; margin: 14px 0 6px; }
    .hint { color: var(--cl-ink-soft); font-size: 13px; font-weight: normal; }
    input[type=text], input[type=password], select {
        width: 100%; padding: 9px 11px; border: 2px solid var(--cl-ink); border-radius: 10px;
        background: #fff; color: inherit; font: inherit;
    }
    input:focus, select:focus { outline: 3px solid var(--cl-sky); outline-offset: 1px; }
    .field-error { color: var(--cl-danger); font-size: 13px; min-height: 0; }
    input.invalid { border-color: var(--cl-danger); background: #fff3f1; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > input { flex: 1; }
    .presets { display: flex; flex-wrap: wrap; gap: 10px; }
    .preset {
        border: 2px solid var(--cl-ink); background: var(--cl-card); color: inherit; padding: 6px 14px;
        border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; box-shadow: 2px 2px 0 var(--cl-ink);
    }
    .preset:hover { background: #fff6d6; }
    .preset.active { background: var(--cl-tape); font-weight: 700; }
    button.btn {
        border: 2px solid var(--cl-ink); border-radius: 10px; padding: 8px 16px; font: inherit; font-weight: 600;
        cursor: pointer; background: var(--cl-card); color: var(--cl-ink); box-shadow: 3px 3px 0 var(--cl-ink);
        transition: transform .08s, box-shadow .08s;
    }
    button.btn:hover:not(:disabled) { background: #fff6d6; }
    button.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--cl-ink); }
    button.primary { background: var(--cl-orange); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--cl-action); }
    button:disabled { opacity: .55; cursor: progress; }
    :focus-visible { outline: 3px solid var(--cl-sky); outline-offset: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    .notice { border: 2px solid var(--cl-ink); border-radius: 10px; padding: 9px 12px; margin: 0 0 10px; font-size: 14px; }
    .notice.warn { background: #fff1c2; }
    .notice.ok { background: #e3f5ea; }
    .notice.bad { background: #ffe1dc; }
    .status { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill { padding: 2px 12px; border-radius: 999px; font-size: 13px; border: 2px solid var(--cl-ink); background: var(--cl-card); }
    .pill.ok { background: var(--cl-mint); }
    .pill.bad { background: #ffc9c0; }
    pre {
        white-space: pre-wrap; word-break: break-all; background: #fff; border: 2px dashed var(--cl-rule);
        padding: 10px; border-radius: 10px; font: 12.5px/1.5 var(--cl-font-mono); max-height: 220px; overflow: auto;
    }
    code { font-family: var(--cl-font-mono); font-size: 13px; background: #fff3cf; padding: 0 4px; border-radius: 4px; }
    .muted { color: var(--cl-ink-soft); font-size: 13px; }
    a { color: var(--cl-action); }
    .link-btn { background: none; border: 0; color: var(--cl-action); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
    /* Language switch and first-run wizard */
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .lang { display: flex; gap: 6px; flex-shrink: 0; margin-top: 4px; }
    .lang button { border: 2px solid var(--cl-ink); background: var(--cl-card); border-radius: 999px; padding: 2px 12px; font: inherit; font-size: 13px; cursor: pointer; }
    .lang button[aria-pressed=true] { background: var(--cl-tape); font-weight: 700; }
    .progress { display: none; gap: 8px; margin: 0 0 18px; flex-wrap: wrap; }
    .progress span { border: 2px solid var(--cl-ink); border-radius: 999px; padding: 2px 12px; font-size: 13px; background: var(--cl-card); }
    .progress span.current { background: var(--cl-tape); font-weight: 700; }
    .progress span.done { background: var(--cl-mint); }
    .wizard-nav { display: none; }
    body.wizard .progress { display: flex; }
    body.wizard .wizard-nav { display: flex; }
    body.wizard .full-only { display: none !important; }
    body.wizard [data-wstep] { display: none; }
    body.wizard[data-step="1"] [data-wstep="1"],
    body.wizard[data-step="2"] [data-wstep="2"],
    body.wizard[data-step="3"] [data-wstep="3"] { display: block; }
    .wizard-only, .welcome { display: none; }
    body.loading main { visibility: hidden; }
    body.wizard .wizard-only { display: block; }
    body.wizard .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    body.wizard .preset { border-radius: 12px; padding: 12px 14px; text-align: left; }
    .preset small { display: none; font-weight: normal; color: var(--cl-ink-soft); font-size: 12.5px; line-height: 1.45; margin-top: 4px; }
    body.wizard .preset small { display: block; }
    .key-block.hidden { display: none; }
    .local-note { display: none; }
    .key-block.hidden + .local-note { display: block; }
</style>
</head>
<body class="loading">
<main>
    <header>
        <div>
            <h1 data-i18n="title"></h1>
            <p class="sub" data-i18n="subtitle"></p>
        </div>
        <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="zh" aria-pressed="false">中文</button>
            <button type="button" data-lang="en" aria-pressed="false">English</button>
        </div>
    </header>

    <div class="progress" id="progress" aria-label="Setup steps">
        <span data-pstep="1" data-i18n="progress1"></span>
        <span data-pstep="2" data-i18n="progress2"></span>
        <span data-pstep="3" data-i18n="progress3"></span>
    </div>

    <section class="card welcome" data-wstep="1">
        <h2 data-i18n="welcomeTitle"></h2>
        <p style="margin:0" data-i18n="welcomeBody"></p>
        <p class="muted" style="margin:8px 0 0" data-i18n="welcomePrivacy"></p>
    </section>

    <section class="card full-only" id="statusCard">
        <h2 data-i18n="statusTitle"></h2>
        <div class="status" id="statusPills"></div>
        <div id="problems" style="margin-top:12px"></div>
    </section>

    <section class="card" data-wstep="1">
        <h2><span class="step">1</span><span data-i18n="providerTitle"></span></h2>
        <div class="presets" id="presets"></div>
        <p class="muted" id="presetHelp" style="margin:10px 0 0"></p>
        <div class="actions wizard-nav">
            <button class="btn primary" type="button" id="next1" data-i18n="next"></button>
            <button class="link-btn" type="button" data-action="full" data-i18n="skipWizard"></button>
        </div>
    </section>

    <section class="card" data-wstep="2">
        <h2><span class="step">2</span><span data-i18n="connectTitle"></span></h2>
        <div class="key-block" id="keyBlock">
            <label for="apiKey"><span data-i18n="keyLabel"></span> <span class="hint" id="keyHint"></span></label>
            <div class="row">
                <input type="password" id="apiKey" autocomplete="off" spellcheck="false">
                <button class="btn" type="button" id="toggleKey" data-i18n="show"></button>
            </div>
            <div class="field-error" id="err-apiKey"></div>
        </div>
        <p class="notice ok local-note" data-i18n="localNoKey"></p>

        <label for="baseUrl"><span data-i18n="urlLabel"></span> <span class="hint" data-i18n="urlHint"></span></label>
        <input type="text" id="baseUrl" spellcheck="false">
        <div class="field-error" id="err-baseUrl"></div>

        <label for="model"><span data-i18n="modelLabel"></span> <span class="hint" id="modelHint"></span></label>
        <input type="text" id="model" spellcheck="false" list="modelList">
        <datalist id="modelList"></datalist>
        <div class="field-error" id="err-model"></div>

        <div class="actions full-only">
            <button class="btn" id="testBtn" data-i18n="test"></button>
            <button class="btn primary" id="saveBtn" data-i18n="save"></button>
        </div>
        <div class="actions wizard-nav">
            <button class="btn" type="button" id="back2" data-i18n="back"></button>
            <button class="btn primary" type="button" id="testSaveBtn" data-i18n="testAndSave"></button>
            <button class="btn" type="button" id="saveAnywayBtn" hidden data-i18n="saveAnyway"></button>
        </div>
        <div id="formResult" style="margin-top:12px"></div>
    </section>

    <section class="card" data-wstep="3">
        <h2><span class="step">3</span><span data-i18n="startTitle"></span></h2>
        <p class="muted full-only" style="margin-top:0" data-i18n="startHelp"></p>
        <p class="wizard-only" style="margin-top:0" data-i18n="startHelpWizard"></p>
        <div class="actions" style="margin-top:6px">
            <button class="btn primary" id="startBtn" data-i18n="start"></button>
            <button class="btn full-only" id="stopBtn" data-i18n="stop"></button>
            <button class="btn" id="logsBtn" data-i18n="openLogs"></button>
        </div>
        <div id="runResult" style="margin-top:12px"></div>
        <div class="actions wizard-nav">
            <button class="btn" type="button" id="back3" data-i18n="back"></button>
            <button class="btn" type="button" data-action="full" data-i18n="allSettings"></button>
            <button class="btn" type="button" data-action="close" data-i18n="finish"></button>
        </div>
    </section>

    <section class="card full-only">
        <h2 data-i18n="advancedTitle"></h2>
        <p class="muted" style="margin:0"><span data-i18n="configFile"></span><code id="configPath"></code>
            <button class="link-btn" id="openConfigBtn" data-i18n="openFolder"></button></p>
        <p class="muted" style="margin:6px 0 0" data-i18n="backupNote"></p>
        <div class="actions">
            <button class="btn" type="button" data-action="wizard" data-i18n="rerunWizard"></button>
            <button class="btn" type="button" data-action="close" data-i18n="finishClose"></button>
        </div>
    </section>
</main>

const $ = id => document.getElementById(id);
let lang = pickInitialLang();
let state = null;
let presetId = 'custom';
let wizardStep = 0;

function pickInitialLang() {
    const saved = localStorage.getItem('cc.lang');
    if (saved === 'zh' || saved === 'en') return saved;
    const first = (navigator.languages?.[0] ?? navigator.language ?? 'en').toLowerCase();
    return first.startsWith('zh') ? 'zh' : 'en';
}

function tr(key, params = {}) {
    const template = I18N[lang][key] ?? I18N.zh[key] ?? key;
    return template.replace(/\{(\w+)\}/g, (match, name) => (name in params ? String(params[name]) : match));
}

function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = tr('pageTitle');
    for (const node of document.querySelectorAll('[data-i18n]')) node.textContent = tr(node.dataset.i18n);
    for (const button of document.querySelectorAll('[data-lang]')) button.setAttribute('aria-pressed', String(button.dataset.lang === lang));
    $('toggleKey').textContent = tr($('apiKey').type === 'password' ? 'show' : 'hide');
    renderPresets();
    if (state) { renderState(); renderKeyHint(); }
}

async function setLang(next) {
    lang = next;
    localStorage.setItem('cc.lang', next);
    applyLang();
    // Problems and field errors come from the server in the page language.
    await refresh(false).catch(() => {});
}

async function api(path, body) {
    const response = await fetch(path, {
        method: body === undefined ? 'GET' : 'POST',
        headers: { 'X-Config-Token': PAGE_SESSION, 'X-Config-Lang': lang, ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) },
        body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await response.json().catch(() => ({ ok: false, message: `HTTP ${response.status}` }));
    if (response.status === 403 || response.status === 421) throw new Error(tr('expired'));
    return data;
}

function notice(target, kind, text, detail) {
    const box = $(target);
    box.textContent = '';
    if (!text) return;
    const div = document.createElement('div');
    div.className = `notice ${kind}`;
    div.textContent = text;
    box.appendChild(div);
    if (detail) {
        const pre = document.createElement('pre');
        pre.textContent = detail;
        box.appendChild(pre);
    }
}

function pill(text, kind) {
    const span = document.createElement('span');
    span.className = `pill ${kind ?? ''}`;
    span.textContent = text;
    return span;
}

function currentPreset() {
    return PRESETS.find(p => p.id === presetId);
}

function renderPresets() {
    const box = $('presets');
    box.textContent = '';
    for (const preset of PRESETS) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `preset ${preset.id === presetId ? 'active' : ''}`;
        button.setAttribute('aria-pressed', String(preset.id === presetId));
        button.append(preset.name[lang]);
        const small = document.createElement('small');
        small.textContent = preset.blurb[lang];
        button.appendChild(small);
        button.onclick = () => choosePreset(preset.id, true);
        box.appendChild(button);
    }
    const current = currentPreset();
    $('presetHelp').textContent = current.help[lang];
    $('modelList').textContent = '';
    for (const model of current.models) {
        const option = document.createElement('option');
        option.value = model;
        $('modelList').appendChild(option);
    }
    $('modelHint').textContent = current.models.length ? tr('modelExample', { model: current.models[0] }) : '';
    renderKeyBlock();
    if (state) renderKeyHint();
}

// Local presets hide the key field in the wizard; the full form keeps it so a key can still be cleared or set.
function renderKeyBlock() {
    const hide = document.body.classList.contains('wizard') && currentPreset().local;
    $('keyBlock').classList.toggle('hidden', Boolean(hide));
}

function choosePreset(id, fill) {
    presetId = id;
    const preset = currentPreset();
    if (fill) {
        $('baseUrl').value = preset.baseUrl;
        if (preset.models.length && !preset.models.includes($('model').value)) $('model').value = preset.models[0];
        if (!preset.models.length && PRESETS.some(p => p.models.includes($('model').value))) $('model').value = '';
        showErrors();
        notice('formResult');
    }
    renderPresets();
}

function detectPreset(baseUrl) {
    if (!baseUrl) return 'deepseek';
    const exact = PRESETS.find(p => p.baseUrl && p.baseUrl.replace(/\/v1$/, '') === baseUrl.replace(/\/v1$/, ''));
    if (exact) return exact.id;
    if (/api\.deepseek\.com/i.test(baseUrl)) return 'deepseek';
    if (/:11434\b/.test(baseUrl)) return 'ollama';
    return 'custom';
}

function renderState() {
    const pills = $('statusPills');
    pills.textContent = '';
    pills.appendChild(state.status.ready ? pill(tr('pillReady'), 'ok') : pill(tr('pillNotReady'), 'bad'));
    if (state.running) pills.appendChild(state.running.cl ? pill(tr('pillRunning'), 'ok') : pill(tr('pillRunningNoCl'), 'bad'));
    else pills.appendChild(pill(tr('pillStopped')));
    const problems = $('problems');
    problems.textContent = '';
    for (const problem of state.problems) {
        const div = document.createElement('div');
        div.className = 'notice warn';
        div.textContent = problem.message;
        problems.appendChild(div);
    }
    $('configPath').textContent = state.configPath;
}

function renderKeyHint() {
    $('keyHint').textContent = state.hasKey ? tr('keySaved', { key: state.maskedKey }) : '';
    $('apiKey').placeholder = state.hasKey ? tr('keyKeepPlaceholder') : currentPreset().local ? tr('keyOptional') : tr('keyPlaceholder');
}

function testOkText(result) {
    return result.reply ? tr('testOkReply', { message: result.message, reply: result.reply }) : tr('emptyReply', { message: result.message });
}

function fillForm() {
    renderKeyHint();
    $('baseUrl').value = state.baseUrl || state.defaults.baseUrl;
    $('model').value = state.model || state.defaults.model;
    choosePreset(detectPreset($('baseUrl').value), false);
}

function formBody() {
    const local = document.body.classList.contains('wizard') && currentPreset().local;
    return { apiKey: local ? '' : $('apiKey').value, baseUrl: $('baseUrl').value, model: $('model').value, keepKey: !local && state?.hasKey };
}

function showErrors(errors = {}) {
    for (const key of ['apiKey', 'baseUrl', 'model']) {
        $(`err-${key}`).textContent = errors[key] ?? '';
        $(key).classList.toggle('invalid', Boolean(errors[key]));
    }
}

async function withBusy(buttons, task, target = 'formResult') {
    buttons.forEach(b => { b.disabled = true; });
    try { await task(); } catch (error) { notice(target, 'bad', error.message); }
    finally { buttons.forEach(b => { b.disabled = false; }); }
}

async function refresh(fill) {
    state = await api('/api/state');
    renderState();
    if (fill) fillForm();
}

function setMode(wizard, step = 1) {
    document.body.classList.toggle('wizard', wizard);
    wizardStep = wizard ? step : 0;
    if (wizard) document.body.dataset.step = String(step);
    else delete document.body.dataset.step;
    for (const span of document.querySelectorAll('[data-pstep]')) {
        const n = Number(span.dataset.pstep);
        span.classList.toggle('current', n === step);
        span.classList.toggle('done', n < step);
    }
    $('saveAnywayBtn').hidden = true;
    renderKeyBlock();
    window.scrollTo({ top: 0 });
}

async function save() {
    const result = await api('/api/save', formBody());
    showErrors(result.errors);
    if (!result.ok) { notice('formResult', 'bad', result.message); return false; }
    $('apiKey').value = '';
    state = result.state;
    renderState();
    fillForm();
    return true;
}

$('toggleKey').onclick = () => {
    const input = $('apiKey');
    input.type = input.type === 'password' ? 'text' : 'password';
    $('toggleKey').textContent = tr(input.type === 'password' ? 'show' : 'hide');
};
$('baseUrl').addEventListener('change', () => choosePreset(detectPreset($('baseUrl').value), false));
for (const button of document.querySelectorAll('[data-lang]')) button.onclick = () => setLang(button.dataset.lang);

async function runTest() {
    notice('formResult', 'warn', tr('testing'));
    const result = await api('/api/test', formBody());
    showErrors(result.errors);
    notice('formResult', result.ok ? 'ok' : 'bad',
        result.ok ? testOkText(result) : result.message, result.detail);
    return result;
}

$('testBtn').onclick = () => withBusy([$('testBtn'), $('saveBtn')], runTest);

$('saveBtn').onclick = () => withBusy([$('testBtn'), $('saveBtn')], async () => {
    if (await save()) notice('formResult', 'ok', tr(state.running ? 'savedRunning' : 'savedNext'));
});

$('next1').onclick = () => setMode(true, 2);
$('back2').onclick = () => setMode(true, 1);
$('back3').onclick = () => setMode(true, 2);

$('testSaveBtn').onclick = () => withBusy([$('testSaveBtn'), $('back2'), $('saveAnywayBtn')], async () => {
    $('saveAnywayBtn').hidden = true;
    const result = await runTest();
    if (!result.ok) {
        // Field errors cannot be saved anyway; network or HTTP failures can, e.g. when the model server is not up yet.
        if (!result.errors) {
            $('saveAnywayBtn').hidden = false;
            notice('formResult', 'bad', `${result.message} ${tr('testFailedWizard')}`, result.detail);
        }
        return;
    }
    if (await save()) {
        notice('formResult');
        notice('runResult', 'ok', testOkText(result));
        setMode(true, 3);
    }
});

$('saveAnywayBtn').onclick = () => withBusy([$('testSaveBtn'), $('back2'), $('saveAnywayBtn')], async () => {
    if (await save()) { notice('formResult'); notice('runResult'); setMode(true, 3); }
});

$('startBtn').onclick = () => withBusy([$('startBtn'), $('stopBtn')], async () => {
    if (!state.status.ready) return notice('runResult', 'bad', tr('needConfig'));
    notice('runResult', 'warn', tr('starting'));
    const result = await api('/api/start', {});
    notice('runResult', result.ok ? 'ok' : 'bad', result.message, result.output);
    await refresh(false);
}, 'runResult');

$('stopBtn').onclick = () => withBusy([$('startBtn'), $('stopBtn')], async () => {
    const result = await api('/api/stop', {});
    notice('runResult', result.ok ? 'ok' : 'bad', result.message, result.ok ? '' : result.output);
    await refresh(false);
}, 'runResult');

$('logsBtn').onclick = () => api('/api/open-logs', {});
$('openConfigBtn').onclick = () => api('/api/open-config-folder', {});

async function closePage() {
    await api('/api/close', {}).catch(() => {});
    const main = document.querySelector('main');
    main.textContent = '';
    const h1 = document.createElement('h1');
    h1.textContent = tr('closedTitle');
    const p = document.createElement('p');
    p.className = 'sub';
    p.textContent = tr('closedBody');
    main.append(h1, p);
}

for (const button of document.querySelectorAll('[data-action]')) {
    button.onclick = () => {
        const action = button.dataset.action;
        if (action === 'full') { setMode(false); notice('formResult'); }
        else if (action === 'wizard') { notice('formResult'); notice('runResult'); setMode(true, 1); }
        else if (action === 'close') closePage();
    };
}

setInterval(() => api('/api/heartbeat', {}).catch(() => {}), 20000);
applyLang();
refresh(true)
    .then(() => setMode(!state.status.ready, 1))
    .catch(error => notice('formResult', 'bad', error.message))
    .finally(() => document.body.classList.remove('loading'));
</script>
</body>
</html>
